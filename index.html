<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot Tính Toán Mạch Điện</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f0f2f5;
    }
    .container {
        width: 100%;
        max-width: 980px;
        margin: auto;
        padding: 10px;
    }
    h2 {
        text-align: center;
    }

    /* MOBILE FIRST */
    .chat-box, .form-box {
        width: 100%;
        margin-bottom: 15px;
        background: white;
        border-radius: 10px;
        padding: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .chat-window {
        height: 250px;
        overflow-y: auto;
        background: #f8f9fa;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
    }
    .msg {
        margin: 8px 0;
        padding: 8px 10px;
        border-radius: 8px;
        width: fit-content;
        max-width: 80%;
    }
    .bot {
        background: #ffffff;
        border-left: 4px solid #4a67ff;
    }
    .user {
        background: #4a67ff;
        color: #ffffff;
        margin-left: auto;
    }

    input, select {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
        border-radius: 6px;
        border: 1px solid #ccc;
        margin-bottom: 10px;
    }

    button {
        width: 100%;
        padding: 10px;
        border: none;
        background: #4a67ff;
        color: white;
        border-radius: 6px;
        margin-top: 5px;
        font-size: 16px;
    }

    .branch-item {
        padding: 10px;
        background: #eef1ff;
        border-radius: 8px;
        margin-bottom: 6px;
    }

    .result-box {
        background: #d9ecff;
        padding: 12px;
        border-radius: 10px;
        margin-top: 10px;
    }
</style>
</head>
<div style="
    margin-top: 20px;
    text-align: center;
    font-size: 14px;
    opacity: 0.3;
">
    Design by: <b>Johnny Đức</b>
</div>

<body>
<div class="container">

    <h2>🔌 Chatbot AI – Tính toán mạch điện nhiều nhánh</h2>

    <!-- CHATBOT -->
    <div class="chat-box">
        <h3>💬 Chatbot</h3>
        <div id="chatWindow" class="chat-window"></div>

        <input id="chatInput" placeholder="Nhập câu hỏi...">
        <button onclick="sendChat()">Gửi</button>
    </div>

    <!-- FORM TÍNH NHIỀU NHÁNH -->
    <div class="form-box">
        <h3>⚡ Thêm nhánh mạch</h3>

        <label>Tên nhánh</label>
        <input id="b_name" placeholder="VD: Ổ cắm phòng khách">

        <label>Công suất P (W)</label>
        <input type="number" id="b_power" placeholder="VD: 1200">

        <label>Hệ số công suất cosφ</label>
        <input type="number" id="b_cos" placeholder="1.0 hoặc 0.8">

        <label>Loại tải</label>
        <select id="b_load">
            <option value="no-motor">Không động cơ</option>
            <option value="motor">Có động cơ</option>
        </select>

        <label>Vật liệu dây</label>
        <select id="b_mat">
            <option value="cu">Dây đồng</option>
            <option value="al">Dây nhôm</option>
        </select>

        <button onclick="addBranch()">➕ Thêm nhánh</button>

        <h3>📋 Danh sách nhánh</h3>
        <div id="branchList"></div>

        <button style="background:#28a745" onclick="calcAll()">🧮 Tính tất cả nhánh & mạch tổng</button>

        <div id="result" class="result-box" style="display:none"></div>
    </div>

</div>

<script>
let branches = [];

function chatBotSay(text){
    let box = document.getElementById("chatWindow");
    let msg = document.createElement("div");
    msg.className = "msg bot";
    msg.innerHTML = text.replace(/\n/g,"<br>");
    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
}

function userSay(text){
    let box = document.getElementById("chatWindow");
    let msg = document.createElement("div");
    msg.className = "msg user";
    msg.innerText = text;
    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
}

chatBotSay("Xin chào! Tôi là trợ lý tính toán mạch điện. Bạn có thể nhập câu hỏi hoặc thêm các nhánh mạch bên dưới.");

async function sendChat(){
    let text = document.getElementById("chatInput").value.trim();
    if(!text) return;

    userSay(text);
    document.getElementById("chatInput").value = "";

    chatBotSay("⏳ Đang xử lý...");

    try {
        let response = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer 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"
            },
            body: JSON.stringify({
                model: "gpt-5.1",
                messages: [
                    { role: "system", content: "Bạn là trợ lý chuyên về kỹ thuật điện dân dụng." },
                    { role: "user", content: text }
                ]
            })
        });

        let data = await response.json();

        let reply = data.choices?.[0]?.message?.content || "Xin lỗi, tôi không thể trả lời lúc này.";

        chatBotSay(reply);

    } catch (e) {
        chatBotSay("⚠️ Lỗi kết nối tới ChatGPT API.");
    }
}



function addBranch(){
    let n = document.getElementById("b_name").value.trim();
    let p = parseFloat(document.getElementById("b_power").value);
    let c = parseFloat(document.getElementById("b_cos").value);
    let load = document.getElementById("b_load").value;
    let mat = document.getElementById("b_mat").value;

    if(!n || !p || !c){
        alert("Bạn phải nhập đủ: tên nhánh, công suất, cosφ");
        return;
    }

    branches.push({name:n, P:p, cos:c, load:load, mat:mat});

    renderList();
}

function renderList(){
    let box = document.getElementById("branchList");
    box.innerHTML = "";

    branches.forEach((b,i)=>{
        let item = document.createElement("div");
        item.className = "branch-item";
        item.innerHTML = `
            <b>${b.name}</b><br>
            P=${b.P}W | cosφ=${b.cos} | ${b.load=="motor"?"Có động cơ":"Không động cơ"} |
            ${b.mat=="cu"?"Dây đồng":"Nhôm"}
            <br>
            <button onclick="delBranch(${i})" style="width:auto; padding:4px 8px; margin-top:4px">Xóa</button>
        `;
        box.appendChild(item);
    });
}

function delBranch(i){
    branches.splice(i,1);
    renderList();
}

function calcAll(){
    if(branches.length === 0){
        alert("Bạn chưa thêm nhánh nào!");
        return;
    }

    let resultHTML = "<h3>📌 KẾT QUẢ TỪNG NHÁNH</h3>";

    let totalP = 0;
    let totalI = 0;

    branches.forEach(b=>{
        let U = 220;
        let cos = b.cos;
        let I = b.P / (U*cos);
        let J = (b.mat=="cu") ? 6 : 4;
        let S = I / J;

        let Sstd = chooseStd(S);

        let hat = (b.load=="motor")?2.0:1.25;
        let Idm = I*hat;
        let MCB = chooseMCB(Idm);

        resultHTML += `
            <div style="margin-bottom:10px">
                <b>${b.name}</b><br>
                P=${b.P}W • cosφ=${cos} → <b>I=${I.toFixed(2)}A</b><br>
                S yêu cầu = ${(S).toFixed(2)}mm² → chọn <b>${Sstd}mm²</b><br>
                Aptomat nhánh → <b>${MCB}A</b>
            </div>
        `;

        totalP += b.P;
        totalI += I;
    });

    // mạch tổng
    let U=220;
    let Itong = totalI;
    let S_tong = Itong / 6;
    let Sstd_tong = chooseStd(S_tong);

    let MCB_tong = chooseMCB(Itong*1.25);

    resultHTML += `
        <h3>🔰 MẠCH TỔNG</h3>
        Tổng công suất: <b>${totalP}W</b><br>
        Tổng dòng: <b>${Itong.toFixed(2)}A</b><br>
        Dây tổng yêu cầu = ${(S_tong).toFixed(2)}mm² → chọn <b>${Sstd_tong}mm²</b><br>
        Aptomat tổng đề xuất → <b>${MCB_tong}A</b>
    `;

    let box = document.getElementById("result");
    box.style.display="block";
    box.innerHTML = resultHTML;

    chatBotSay("Tôi đã tính xong. Kéo xuống dưới để xem kết quả chi tiết!");
}

function chooseStd(S){
    let std = [0.5,0.75,1,1.5,2,2.5,4,6,10,16,25,35];
    for(let x of std){
        if(x>=S) return x;
    }
    return std[std.length-1];
}

function chooseMCB(I){
    let list=[6,10,16,20,25,32,40,50,63,80,100];
    for(let x of list){
        if(x>=I) return x;
    }
    return list[list.length-1];
}

</script>
</body>
</html>
